spring:
  application:
    name: procurement-system

  datasource:
    url: jdbc:mysql://localhost:3306/procurement_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

server:
  port: 8081

app:
  jwt:
    # Base64-encoded HMAC key. In production, set this via the JWT_SECRET
    # environment variable instead of committing a real secret here.
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm
    expiration-ms: 86400000
  mail:
    from: ${MAIL_FROM:noreply@procurementsystem.com}
    # Set to false to disable actually sending emails (e.g. in local/dev environments
    # without SMTP credentials configured). Notifications are still logged.
    enabled: ${MAIL_ENABLED:false}